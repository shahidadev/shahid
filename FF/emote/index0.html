<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/png" href="/profile.png">
  <title>FF Emote Bot</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
    }
    #frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
    }
    #loader {
      position: fixed;
      top: 8px;
      right: 8px;
      width: 100vw;
      height: 100vh;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      color: #fff;
      font-family: sans-serif;
      border-radius: 4px;
      z-index: 10000;
      font-size: 13px;
    }
  </style>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-X46P9RMLLY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-X46P9RMLLY');
</script>
<body>
  <div id="loader">Loading…</div>
  <iframe id="frame" src="about:blank" allowfullscreen></iframe>

  <script>
    (function(){
      'use strict';
      const baseIframeUrl = 'https://clouflare-test.pages.dev/';
      function loadIframeWithAndClean() {
        const iframe = document.getElementById('frame');
        const loader = document.getElementById('loader');
        const search = window.location.search || '';
        const hash = window.location.hash || '';
        const params = search + hash;
        const finalIframeUrl = baseIframeUrl + (params ? params : '');
        iframe.src = finalIframeUrl;
        try {
          const cleanPath = window.location.pathname; 
          history.replaceState(null, '', cleanPath);
        } catch (e) {
          console.error('Could not clean URL via history.replaceState:', e);
        }
        iframe.addEventListener('load', function onLoad() {
          loader.style.display = 'none';
          iframe.removeEventListener('load', onLoad);
        });
        setTimeout(function(){
          loader.style.display = 'none';
        }, 5000);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadIframeWithAndClean);
      } else {
        loadIframeWithAndClean();
      }
    })();
  </script>
</body>
</html>
